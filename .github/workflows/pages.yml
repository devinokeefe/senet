# Publishes the portable page (tools/build_portable.py) as the project's site,
# https://devinokeefe.github.io/senet/, from main. The repository's Pages source must be
# "GitHub Actions" (Settings, Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the portable page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build it as the site's index.html
        run: |
          python -m pip install numpy -c .github/constraints.txt
          python tools/build_portable.py --out _site/index.html
      - name: Play it offline
        run: node tools/check_portable.mjs _site/index.html models/senet_net.bin
      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
