[package]
name = "senet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "The senet command: solve the game, audit and query the database, play matches, serve the web app"

[[bin]]
name = "senet"
path = "src/main.rs"

[dependencies]
senet-core = { path = "../senet-core" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
